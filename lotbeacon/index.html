')}"></polyline></svg>`}function qItem(x){const active=x.id===state.active,ex=x.trend.visible&&x.trend.confidence>=d.meta.trendModel.minimumVisibleConfidence?`<div class="exception"><div class="excopy"><div class="extitle">${esc(x.trend.compact)}</div><div class="exaction">→ ${esc(x.trend.action)}</div></div>${qSpark(x)}</div>`:`<div class="next ${/manager|F&I|policy|hold/i.test(x.next)?'warn':''}">→ ${esc(x.next)}</div>`;return `<button class="lead ${active?'active':''}" data-a="lead" data-id="${x.id}"><div class="leadtop"><span class="dot"></span><span class="lname">${esc(x.name)}</span><span class="wait">waiting ${formatWait(x.wait)}</span></div><div class="context">${esc(x.context)}</div>${ex}</button>`}function top(){return `<header class="topbar"><div class="brand"><div class="mark">L</div><strong>LotBeacon</strong></div><div class="dealer">${esc(d.dealership.name)}</div><div class="preview">Synthetic pilot preview</div><div class="keys"><span><kbd>J</kbd>/<kbd>K</kbd> next lead</span><span>·</span><span><kbd>E</kbd> edit</span><span>·</span><span><kbd>⌘↵</kbd> send & next</span><span>·</span><span><kbd>1</kbd>/<kbd>2</kbd> slot pair</span></div><span style="font-size:10px;color:rgba(255,255,255,.62)">You:</span><button class="rep" data-a="rep"><span>${esc(d.dealership.rep)}</span><span>⌄</span></button></header>`}function queue(){const l=ordered();return `<aside class="queue"><div class="qhead"><h2>Queue</h2><span>${l.length} need you · ${d.leads.length} total</span></div><div class="qtabs"><button class="qtab active">Reply now</button><button class="qtab" data-a="soon">Booking ready</button><span class="qcount">${l.length}</span></div><div class="qlist">${l.map(qItem).join('')}</div><div class="qfoot"><strong>Trend policy:</strong> eight communication events stay in the model. Only material, actionable exceptions surface here.</div></aside>`}function stages(x){const a=["Engage","Qualify","Book","Visit outcome"],i=Math.max(0,a.indexOf(x.stage));return `<div class="stagebar">${a.map((s,j)=>`<span class="stage ${j<i?'done':j===i?'current':''}">${s}</span>`).join('')}<span class="stagenote">${esc(x.state)}</span><span class="stagestate">${esc(x.trend.visible?x.trend.action:x.state)}</span></div>`}function messages(x){return x.messages.map(m=>`${m.new?'<div class="newdiv">NEW</div>':''}<div class="mrow ${m.d==='out'?'out':'in'}"><div class="bubble">${esc(m.x)}<div class="mmeta">${esc(m.a)} · ${esc(m.t)}</div></div></div>`).join('')}function action(x){return `<section class="action"><div class="asum"><div class="atop"><div><div class="kicker">Goal</div><div class="goal">${esc(x.goal)}</div></div><div class="missing">Missing: ${esc(x.missing)}</div></div><div class="known"><span>Known:</span>${x.known.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}<span class="siginline">${esc(x.trend.compact)}</span></div></div><textarea class="draft" id="draft" data-id="${x.id}">${esc(state.drafts[x.id]??x.draft)}</textarea><div class="cactions"><button class="btn danger" data-a="escalate" data-id="${x.id}">${state.escalated.has(x.id)?'Manager request sent':'Escalate decision'}</button><button class="btn primary" data-a="send" data-id="${x.id}">Send & next</button><span class="sendmeta"><span class="check">claims re-checked at send</span> · human approval required</span></div></section>`}function convo(x){return `<main class="conversation"><div class="thead"><div class="tname">${esc(x.name)}</div><div class="tmeta">${esc(d.dealership.channel)} · ${formatWindow(x.window)} &nbsp;&nbsp; <span class="owner">${state.manual?'Manual control':`AI drafting · ${d.dealership.rep} sends · no autonomous sends`}</span></div><div class="tactions"><button class="btn" data-a="manual">${state.manual?'Resume AI drafting':'Switch to manual'}</button><button class="btn circle" data-a="copy" title="Copy preview link">•••</button></div></div>${stages(x)}<div class="messages" id="messages">${messages(x)}</div>${action(x)}</main>`}function dim(k,x){const last=x.values.at(-1),signed=x.delta>0?`+${x.delta}`:x.delta,cls=k==='appointmentProgress'&&x.delta>0?'good':x.direction==='down'?'down':'up';return `<div class="dim"><div class="dimtop"><span class="dimname">${esc(x.label)}</span><span class="dimval">${last}</span><span class="delta ${cls}">${x.direction==='up'?'↑':x.direction==='down'?'↓':'→'} ${signed}</span></div>${dSpark(k,x.values)}<div class="dnote">${esc(x.note)}</div></div>`}function rail(x){const v=d.vehicle;return `<aside class="rail"><section class="card pad"><div class="rk">Vehicle</div><div class="vname">${esc(v.name)}</div>${[["Stock",v.stock],["Drivetrain",v.drivetrain],["Color",v.color],["Mileage",num(v.mileage)],["Price",money(v.price)],["Status",v.status]].map(r=>`<div class="vrow"><span>${r[0]}</span><strong>${esc(r[1])}</strong></div>`).join('')}<div class="verified">✓ demo feed refreshed ${Math.floor(v.freshness/60)}m ${v.freshness%60}s ago</div><div class="disclosure">Illustrative vehicle record. Live availability, price authority, and final terms still require dealership systems and authorized staff.</div></section><section class="card details"><details open><summary>Communication signal · 8 events</summary><div class="dcontent"><div class="signal"><strong>${esc(x.trend.headline)}</strong><span>${Math.round(x.trend.confidence*100)}% signal confidence · exception-only display</span></div>${Object.entries(x.trend.dimensions).map(([k,z])=>dim(k,z)).join('')}<div class="rankwhy"><strong>Why this moved up:</strong> ${esc(x.rank)}</div></div></details><details><summary>Evidence for each fact (${x.evidence.length})</summary><div class="dcontent evidence">${x.evidence.map(e=>`<div class="eitem"><strong>${esc(e[0])} · ${e[2]}</strong><span>${esc(e[1])}</span></div>`).join('')}</div></details><details><summary>Stage history (${x.history.length})</summary><div class="dcontent evidence">${x.history.map((h,i)=>`<div class="eitem"><strong>${i+1}. ${esc(h)}</strong><span>Event-derived state; manual correction remains available.</span></div>`).join('')}</div></details><details><summary>Diagnostics & metadata</summary><div class="dcontent">${[["Schema",d.meta.schemaVersion],["Build",d.meta.buildId],["Classification",x.diag[0]],["Next action",x.diag[1]],["Guardrail",x.diag[2]],["Data",d.meta.dataClassification],["Trend model",d.meta.trendModel.version]].map(m=>`<div class="metarow"><span>${m[0]}</span><code>${esc(m[1])}</code></div>`).join('')}</div></details></section><section class="card pad simulate"><div class="rk">Demo: simulate customer</div><textarea id="simulate" placeholder="What ${esc(x.name)} says next…"></textarea><div class="simactions"><button class="btn primary" data-a="receive">Receive</button><button class="btn" data-a="example">Price objection</button></div><div class="simnote">Runs locally against deterministic demo rules. No message is sent to Facebook or a dealership system.</div></section></aside>`}function render(){const x=current();app.innerHTML=`<div class="shell">${top()}<div class="workspace">${queue()}${convo(x)}${rail(x)}</div></div>`;requestAnimationFrame(()=>{const m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight})}function move(n){const l=ordered();if(!l.length)return;let i=Math.max(0,l.findIndex(x=>x.id===state.active));state.active=l[(i+n+l.length)%l.length].id;render()}function send(id){const before=ordered(),i=Math.max(0,before.findIndex(x=>x.id===id));state.sent.add(id);const after=ordered();if(after.length)state.active=after[Math.min(i,after.length-1)].id;toast('Demo reply approved; opening the next lead.');render()}function slots(i){const x=current(),a=["Would 10:30 AM or 1:45 PM work better? I’ll verify the vehicle and lock in the exact time once you choose.","I have 11:15 AM or 3:40 PM available. Which one fits your day better?"];state.drafts[x.id]=a[i];render();requestAnimationFrame(()=>document.getElementById('draft')?.focus());toast(`Slot pair ${i+1} loaded.`)}function receive(){const f=document.getElementById('simulate'),text=f?.value.trim();if(!text)return toast('Type the customer’s next message first.');const x=current();x.messages.forEach(m=>m.new=false);x.messages.push({d:'in',a:'Customer',t:'just now',new:true,x:text});x.wait=1;x.context='latest synthetic reply · signal recalculated';if(/\$|off|price|manager|deal/i.test(text)){x.trend.visible=true;x.trend.confidence=.92;x.trend.headline='HIGH INTENT · FRICTION ESCALATING';x.trend.compact='High intent · friction rising';x.trend.action='Human decision now';x.next='Get human decision now';for(const [k,z] of Object.entries(x.trend.dimensions)){const add=k==='friction'?9:k==='purchaseIntent'?7:k==='appointmentProgress'&&/today|tomorrow|am|pm/i.test(text)?12:k==='engagement'?-3:2;z.values=[...z.values.slice(-7),Math.max(0,Math.min(100,z.values.at(-1)+add))];z.delta=z.values.at(-1)-z.values[0]}}x.rank='The latest synthetic message materially increased purchase intent and friction, so the conversation moved up the queue.';delete state.drafts[x.id];render();toast('Synthetic reply received; eight-event signals recalculated.')}document.addEventListener('click',e=>{const c=e.target.closest('[data-a]');if(!c)return;const a=c.dataset.a;if(a==='lead'){state.active=c.dataset.id;render()}else if(a==='manual'){state.manual=!state.manual;render();toast(state.manual?'Manual control enabled.':'AI drafting resumed; human send remains required.')}else if(a==='send')send(c.dataset.id);else if(a==='escalate'){state.escalated.add(c.dataset.id);render();toast('Manager decision request recorded. No price promise was sent.')}else if(a==='example'){const f=document.getElementById('simulate');f.value='Fine—$2,000 off and I can be there at 3:30 today. Can your manager do that?';f.focus()}else if(a==='receive')receive();else if(a==='copy'){navigator.clipboard?.writeText(location.href).then(()=>toast('Preview link copied.')).catch(()=>toast('Use the browser address bar to copy the link.'))}else if(a==='rep')toast(`${d.dealership.rep} is the named human sender in this preview.`);else if(a==='soon')toast('Additional queue bands are staged for the pilot.');});document.addEventListener('input',e=>{if(e.target.id==='draft')state.drafts[e.target.dataset.id]=e.target.value});document.addEventListener('keydown',e=>{const typing=e.target.matches?.('input,textarea')||e.target.isContentEditable;if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();send(state.active);return}if(typing)return;if(e.key.toLowerCase()==='j'){e.preventDefault();move(1)}else if(e.key.toLowerCase()==='k'){e.preventDefault();move(-1)}else if(e.key.toLowerCase()==='e'){e.preventDefault();document.getElementById('draft')?.focus()}else if(e.key==='1'){e.preventDefault();slots(0)}else if(e.key==='2'){e.preventDefault();slots(1)}});render();})();
